# Digital ocean spec file, on change run $ doctl apps update $APP_ID --spec spec.yaml
#
#
# Digital ocean does not support redis cluster via spec.yaml,
# a manual flow trough dashbord is needed to create a `redis cluster`, select same datacenter for where
# application is deployed for obvious reasons
# After "get started flow" a connection string will be given, embedding a username and password,
# Inject via env var , read p.394 zero to production for more info.
#
# Additional runtime secrets are managed outside this checked-in spec:
# - APP_APPLICATION__HMAC_SECRET
# - APP_EMAIL_CLIENT__AUTHORIZATION_TOKEN
# - APP_REDIS_URI

name: backend-core

region: fra1
envs:
  - key: APP_ENVIRONMENT
    scope: RUN_TIME
    value: production
  - key: APP_APPLICATION__BASE_URL
    scope: RUN_TIME
    value: ${APP_URL}
  - key: APP_DATABASE__USERNAME
    scope: RUN_TIME
    value: ${backendcore-db.USERNAME}
  - key: APP_DATABASE__PASSWORD
    scope: RUN_TIME
    value: ${backendcore-db.PASSWORD}
  - key: APP_DATABASE__HOST
    scope: RUN_TIME
    value: ${backendcore-db.HOSTNAME}
  - key: APP_DATABASE__PORT
    scope: RUN_TIME
    value: ${backendcore-db.PORT}
  - key: APP_DATABASE__DATABASE_NAME
    scope: RUN_TIME
    value: ${backendcore-db.DATABASE}
services:
  - name: api
    #relative to repo root
    dockerfile_path: Dockerfile
    source_dir: .
    github:
      branch: main
      deploy_on_push: true
      repo: Vickeviking/backend_core
    health_check:
      http_path: /health_check
    # should match configuration/production.yaml
    http_port: 8000
    # here we can scale up, but to keep bill low , keep at 1, atleast 2 for prod
    instance_count: 1
    instance_size_slug: basic-xxs

    routes:
      - path: /

    envs:
      - key: APP_RUNTIME
        scope: RUN_TIME
        value: api
workers:
  - name: worker
    dockerfile_path: Dockerfile
    source_dir: .
    github:
      branch: main
      deploy_on_push: true
      repo: Vickeviking/backend_core
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: APP_RUNTIME
        scope: RUN_TIME
        value: worker

databases:
  #Postgres
  - engine: PG
    #Db name
    name: backendcore-db
    # keeping bill small
    num_nodes: 1
    size: db-s-dev-database
    # PG version
    version: "16"
