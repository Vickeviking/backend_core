[package]
name = "backend_core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "backend_core"

[dependencies]
actix-web = "4.12.1"
reqwest = "0.13.1"
serde = {version = "1", features = ["derive"]}
tokio = { version = "1", features = ["macros", "rt-multi-thread"]}
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
