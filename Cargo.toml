[package]
name = "backend_core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "backend_core"

[dependencies]
actix-web = "4.12.1"
chrono = { version = "0.4.22", default-features = false, features = ["clock"] }
config = "0.15.19"
claims = "0.8"
serde = {version = "1", features = ["derive"]}
serde-aux = "4"
secrecy = { version = "0.10.3", features = ["serde"]}
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "macros",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"]}
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"]}
tracing-bunyan-formatter = "0.3"
tracing-log = "0.1"
tracing-actix-web = "=0.7.5"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"
validator = "0.20"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls"]

[dev-dependencies]
once_cell = "1"
fake = "4.0"
tokio = { version = "1", features = ["macros", "rt"]}
#prop testing, run test multiple times, and shrinks failing case
quickcheck = "1"
quickcheck_macros = "1"
rand = "0.9" #fake 4.0 needs this version, used by quickcheck aswell
wiremock = "0.6" #Inercept http request to check target address and headers among others
serde_json = "1"
