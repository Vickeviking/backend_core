name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  SQLX_VERSION: 0.8.6
  SQLX_FEATURES: "rustls,postgres"
  APP_USER: app
  APP_USER_PWD: secret
  APP_DB_NAME: backend_core
  DATABASE_URL: postgres://app:secret@localhost:5432/backend_core

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: |
          cargo install sqlx-cli \
            --version "${SQLX_VERSION}" \
            --no-default-features \
            --features "${SQLX_FEATURES}" \
            --locked

      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create app user in Postgres
        run: |
          CREATE_USER="CREATE USER ${APP_USER} WITH PASSWORD '${APP_USER_PWD}';"
          ALTER_USER="ALTER USER ${APP_USER} CREATEDB;"

          PGPASSWORD="password" psql -h localhost -U postgres -c "${CREATE_USER}"
          PGPASSWORD="password" psql -h localhost -U postgres -c "${ALTER_USER}"

      - name: Prepare database
        run: SKIP_DOCKER=true cargo xtask db-init

      - name: Run tests
        run: cargo test --all-targets

      - name: Check sqlx queries are fresh
        run: cargo sqlx prepare --workspace --check -- --all-targets

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Enforce formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Lint frontend
        run: npm run lint
        working-directory: apps/web

      - name: Build frontend
        run: npm run build
        working-directory: apps/web

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: |
          cargo install sqlx-cli \
            --version "${SQLX_VERSION}" \
            --no-default-features \
            --features "${SQLX_FEATURES}" \
            --locked

      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create app user in Postgres
        run: |
          CREATE_USER="CREATE USER ${APP_USER} WITH PASSWORD '${APP_USER_PWD}';"
          ALTER_USER="ALTER USER ${APP_USER} CREATEDB;"

          PGPASSWORD="password" psql -h localhost -U postgres -c "${CREATE_USER}"
          PGPASSWORD="password" psql -h localhost -U postgres -c "${ALTER_USER}"

      - name: Prepare database
        run: SKIP_DOCKER=true cargo xtask db-init

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: |
          cargo llvm-cov \
            --all-features \
            --workspace \
            --lcov \
            --output-path lcov.info

      - name: Generate HTML report
        run: cargo llvm-cov report --html --output-dir coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
